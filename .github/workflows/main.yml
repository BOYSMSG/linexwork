name: Linux-SSH

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ssh-${{ github.run_id }}

          tailscale ip -4 | tee ip.txt
          echo "TAILSCALE_IP=$(cat ip.txt)" >> $GITHUB_ENV

      - name: Show SSH info
        run: |
          echo "=============================="
          echo " SSH READY"
          echo " IP   : $TAILSCALE_IP"
          echo " User : runner"
          echo " SSH  : ssh runner@$TAILSCALE_IP"
          echo "=============================="

      - name: Keep alive
        run: |
          while true; do sleep 300; done
