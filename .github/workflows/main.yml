name: Linux-RDP-Fixed

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install desktop and XRDP
        run: |
          sudo apt update
          sudo apt install -y \
            xfce4 xfce4-goodies \
            xrdp dbus-x11 \
            xorgxrdp

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

      - name: Disable Wayland
        run: |
          sudo sed -i 's/^#WaylandEnable=false/WaylandEnable=false/' /etc/gdm3/custom.conf || true

      - name: Create RDP user
        run: |
          USER=rdp
          PASS=$(openssl rand -base64 12)

          sudo useradd -m -s /bin/bash $USER
          echo "$USER:$PASS" | sudo chpasswd
          sudo usermod -aG sudo $USER

          echo "RDP_USER=$USER" >> $GITHUB_ENV
          echo "RDP_PASS=$PASS" >> $GITHUB_ENV

      - name: Configure XFCE session
        run: |
          echo "xfce4-session" | sudo tee /home/rdp/.xsession
          sudo chown rdp:rdp /home/rdp/.xsession

          sudo systemctl restart xrdp

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-linux-${{ github.run_id }}

          tailscale ip -4 | tee ts_ip.txt
          echo "TAILSCALE_IP=$(cat ts_ip.txt)" >> $GITHUB_ENV

      - name: Show RDP info
        run: |
          echo "=============================="
          echo " Address  : $TAILSCALE_IP"
          echo " Port     : 3389"
          echo " Username : $RDP_USER"
          echo " Password : $RDP_PASS"
          echo "=============================="

      - name: Keep alive
        run: |
          while true; do
            sleep 300
          done
