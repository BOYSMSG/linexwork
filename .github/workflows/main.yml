name: Linux-SSH-Termius

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ssh-${{ github.run_id }}

          tailscale ip -4 | tee ip.txt
          echo "TS_IP=$(cat ip.txt)" >> $GITHUB_ENV

      - name: Show SSH connection details
        run: |
          echo "=============================="
          echo " SSH READY (Termius)"
          echo " Address : $TS_IP"
          echo " Port    : 22"
          echo " User    : runner"
          echo " Auth    : SSH key (no password)"
          echo "=============================="

      - name: Keep runner alive
        run: |
          while true; do
            sleep 300
          done
